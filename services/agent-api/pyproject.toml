[project]
name = "agent-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "天凉好个秋丶", email = "oncwnuFsC2VbSxMz0dd2POh4Jytg@git.weixin.qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthro>=1.1.1",
    "asyncpg>=0.31.0",
    "ddgs>=9.14.4",
    "email-validator>=2.2",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-ai[ag-ui]==2.22.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "trafilatura>=2.2.0",
]

[project.scripts]
agent-api = "agent_api:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "authenticated_api: install a persisted test user for protected API tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
